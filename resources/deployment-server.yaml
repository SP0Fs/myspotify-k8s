apiVersion: apps/v1
kind: Deployment
metadata:
  name: your-spotify
  namespace: your-spotify
  labels:
    app: your-spotify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: your-spotify
  template:
    metadata:
      labels:
        app: your-spotify
    spec:
      containers:
        - name: your-spotify
          image: yooooomi/your_spotify_server
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb.mongodb.svc.cluster.local:27017/your_spotify"

            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: your-spotify-secrets
                  key: SPOTIFY_CLIENT_ID

            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: your-spotify-secrets
                  key: SPOTIFY_CLIENT_SECRET

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: your-spotify-secrets
                  key: JWT_SECRET

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
